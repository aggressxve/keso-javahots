    <label for="sidebar-active" id="overlay"></label>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container contact-container">
    <div class="row g-5 align-items-center">
      
      <!-- Columna izquierda: Título e Imagen -->
      <div class="col-12 col-md-6 contact-image-container">
        <h1 class="contact-title display-4 text-start w-100 px-3 px-md-5">Contáctanos</h1>
        <img src="images/logo-removebg-preview.png" alt="Pastelería Keso Logo" class="img-fluid">
      </div>

      <!-- Columna derecha: Formulario -->
      <div class="col-12 col-md-6">
        <div class="contact-card">
          <form action="#" method="POST">
            <div class="mb-4">
              <label for="name" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="name" placeholder="Ingresa tu nombre" required>
            </div>
            
            <div class="mb-4">
              <label for="surname" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="surname" placeholder="Ingresa tu apellido" required>
            </div>

            <div class="mb-4">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo electrónico" required>
            </div>

            <div class="mb-4">
              <label for="message" class="form-label">Mensaje</label>
              <textarea class="form-control" id="message" rows="4" placeholder="Ingresa tu mensaje" required></textarea>
            </div>

            <button type="submit" class="btn btn-submit">Enviar</button>
          </form>
        </div>
      </div>

    </div>
  </main>

            <a href="#" class="text-white"><img src="images/imgFooter/icons8-instagram-48.png" width="32" alt="Instagram"></a>
          </div>

        <div class="col-12 col-md-4 text-center text-md-end">
          <h4 class="fw-bold mb-3">Contacto</h4>
