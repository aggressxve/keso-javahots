<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Importación de Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Outfit:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>Keso - Pedido Personalizado</title>
</head>

<body class="all-pages-background">

    <div class="container my-5">
        <div class="row align-items-center g-4">
            <div class="col-12 col-lg-5 text-center text-lg-start">
                <h1 class="display-4 fw-bold">Cuéntanos, ¿cómo te gustaría tu pastel?</h1>
                <p class="lead text-muted mt-3">Diseña tu pastel ideal eligiendo bizcocho, relleno, cobertura y todos los detalles que lo harán único.</p>
            </div>
            <div class="col-12 col-lg-7">
                <form class="row g-3" id="form-pedido">
                    <!-- Campo de nombre -->
                    <div class="col-12">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
                    </div>

                    <!-- Campo de sabor bizcocho -->
                    <div class="col-12 col-md-6">
                        <label for="bizcocho" class="form-label">Sabor del Bizcocho</label>
                        <select id="bizcocho" name="bizcocho" class="form-select" required>
                            <option value="" selected disabled>Seleccionar...</option>
                            <option value="vainilla">Vainilla</option>
                            <option value="chocolate">Chocolate</option>
                            <option value="fresa">Fresa</option>
                        </select>
                    </div>

                    <!-- Campo de sabor del relleno -->
                    <div class="col-12 col-md-6">
                        <label for="relleno" class="form-label">Sabor del Relleno</label>
                        <select id="relleno" name="relleno" class="form-select" required>
                            <option value="" selected disabled>Seleccionar...</option>
                            <option value="vainilla">Vainilla</option>
                            <option value="chocolate">Chocolate</option>
                            <option value="fresa">Fresa</option>
                        </select>
                    </div>

                    <!-- Campo de sabor de la cobertura -->
                    <div class="col-12 col-md-6">
                        <label for="cobertura" class="form-label">Sabor de la Cobertura</label>
                        <select id="cobertura" name="cobertura" class="form-select" required>
                            <option value="" selected disabled>Seleccionar...</option>
                            <option value="vainilla">Vainilla</option>
                            <option value="chocolate">Chocolate</option>
                            <option value="fresa">Fresa</option>
                        </select>
                    </div>

                    <!-- Campo de número de personas -->
                    <div class="col-12 col-md-6">
                        <label for="personas" class="form-label">Número de Personas</label>
                        <select id="personas" name="personas" class="form-select" required>
                            <option value="" selected disabled>Seleccionar...</option>
                            <option value="10">10 personas</option>
                            <option value="15">15 personas</option>
                            <option value="30">30 personas</option>
                            <option value="50">50 personas</option>
                        </select>
                    </div>

                    <!-- Campo de tipo de entrega -->
                    <div class="col-12 col-md-6">
                        <label for="entrega" class="form-label">Entrega</label>
                        <select id="entrega" name="entrega" class="form-select" required>
                            <option value="" selected disabled>Seleccionar...</option>
                            <option value="domicilio">Entregar en Domicilio</option>
                            <option value="tienda">Recoger en Tienda</option>
                        </select>
                    </div>

                    <!-- Campo de número de teléfono -->
                    <div class="col-12 col-md-6">
                        <label for="telefono" class="form-label">Número de Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej. 55 1234 5678" required>
                    </div>

                    <!-- Campo de fecha -->
                    <div class="col-12 col-md-6">
                        <label for="fecha" class="form-label">¿Para qué día quieres tu pastel?</label>
                        <input type="date" class="form-control" id="fecha" name="fecha" required>
                    </div>

                    <!-- Campo de descripción -->
                    <div class="col-12">
                        <label for="descripcion" class="form-label">Descripción / Detalles adicionales</label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="4"
                            placeholder="Cuéntanos detalles de diseño, temática, colores o dedicatoria..." required></textarea>
                    </div>
                    
                    <!-- Botón Enviar -->
                    <div class="col-12 text-center text-lg-start mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Enviar Pedido</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap y componentes globales -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/navbar y footer.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            llamarNavbar();
            cargarFooter();

            // Bloquear fechas pasadas en el selector de fecha
            const inputFecha = document.getElementById("fecha");
            if (inputFecha) {
                const hoy = new Date().toISOString().split("T")[0];
                inputFecha.min = hoy;
            }
        });
    </script>
</body>

</html>
