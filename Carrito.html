<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="./images/Keso-favicon.png">

    <!-- Importación de Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Outfit:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./carrito.css">
    <title>Keso - Carrito</title>
</head>

<body>
   <div class="container my-4 carrito-container">
    <h2 class="fw-bold mb-4">Tu carrito</h2>

    <div class="row g-4">

      <!-- LISTA DE PRODUCTOS -->
      <div class="col-12 col-lg-8">
        <div id="lista-carrito" class="d-flex flex-column gap-3">
        </div>

        <p id="carrito-vacio" class="text-center text-muted py-5 d-none">
          Tu carrito está vacío. <a href="Catálogo.html">Ver catálogo</a>
        </p>
      </div>

      <!-- RESUMEN -->
      <div class="col-12 col-lg-4">
        <div class="resumen-card">
          <h3 class="fw-bold mb-3">Resumen</h3>

          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <span id="resumen-subtotal">$0.00</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span>Envío</span>
            <span>Se calcula al pagar</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
            <span>Total</span>
            <span id="resumen-total">$0.00</span>
          </div>

          <button class="btn btn-cta w-100" id="btn-pagar">Pasar a pagar</button>
        </div>
      </div>

    </div>
  </div>




    <!-- Llamar navbar y footer-->
     <script src="./js/carrito.js"></script>
    <script src="./js/navbar y footer.js"></script>
    <script>cargarFooter();</script>
    <script>llamarNavbar()</script>

</body>

</html>
