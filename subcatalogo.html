<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Importación de Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Outfit:wght@300;400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <title>Keso - Detalle de producto</title>
</head>

<body class="all-pages-background">

  <div class="producto-detalle">

    <div class="producto-galeria">
      <div class="producto-miniaturas">
        <img class="miniatura" src="" alt="">
        <img class="miniatura" src="" alt="">
        <img class="miniatura" src="" alt="">
      </div>
      <div class="producto-imagen-principal-contenedor">
        <img id="producto-imagen-principal" src="" alt="">
      </div>
    </div>

    <div class="producto-info">
      <h1 id="producto-nombre"></h1>
      <p id="producto-descripcion" class="producto-descripcion"></p>
      <ul id="producto-specs" class="producto-specs"></ul>
    </div>

      <div class="producto-compra">
        <label for="producto-cantidad" class="producto-cantidad-label">Cantidad:</label>
        <input type="number" id="producto-cantidad" min="1" value="1">
        <button type="button" class="btn-agregar-carrito">Agregar al carrito</button>
      </div>
    </div>

  </div>

  <div class="otros-pasteles-seccion">
    <h2>Otros pasteles:</h2>
    <div id="otros-pasteles" class="otros-pasteles-contenedor"></div>
  </div>

  <!--CSS-->
  <style>
    .producto-detalle {
      display: flex;
      grid-template-columns: auto 1fr 1.2fr;
      gap: 1.5rem;
      padding: 2rem 1.5rem;
      align-items: start;
    }

    .producto-galeria {
      display: flex;
      gap: 1rem;
      grid-column: 1 / 3;
    }

    .producto-miniaturas {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .producto-miniaturas .miniatura {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      background-color: #fff;
    }

    .producto-imagen-principal-contenedor {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1 / 1;
      background-color: #fff;
    }

    #producto-imagen-principal {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .producto-info{
      display: flex;
      flex-direction: column;
      width: 40%
    }

    .producto-info h1 {
      font-family: var(--fuente-titulos);
      color: var(--color-primario);
      margin-bottom: 1rem;
    }

    .producto-descripcion {
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .producto-specs {
      list-style: disc;
      padding-left: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .producto-compra {
      margin-top: 15rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
    }

    .producto-compra input {
      width: 100%;
      max-width: 200px;
      padding: .4rem;
      border-radius: 30px;
      border: 1px solid #ccc;
    }

    .btn-agregar-carrito {
      background-color: var(--color-acento);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .6rem 1.2rem;
      font-weight: 600;
    }

    .otros-pasteles-seccion {
      padding: 0 1.5rem 2rem;
    }

    .otros-pasteles-seccion h2 {
      font-family: var(--fuente-titulos);
      margin-bottom: 1rem;
    }

    .otros-pasteles-contenedor {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .otro-pastel {
      display: block;
      text-decoration: none;
      color: var(--text-color);
      background-color: #ddd;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
    }

    .otro-pastel img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .otro-pastel p {
      padding: .8rem;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .producto-detalle {
        grid-template-columns: 1fr;
      }

      .producto-galeria {
        grid-column: 1;
      }

      .producto-compra {
        align-items: stretch;
      }
    }
  </style>

  <!-- Llamar navbar y footer-->
  <script src="./js/navbar y footer.js"></script>
  <script>cargarFooter();</script>
  <script>llamarNavbar()</script>
  <script type="module" src="/js/subcatalogo.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
