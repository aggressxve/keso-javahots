<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Importación de Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Outfit:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>Keso - Pedido Personalizado</title>
</head>

<body class="all-pages-background">

    <div class="container text-center">

        <div class="row">
            <div class="col">
                <h1 class="display-4">Cuentanos, ¿como te gustaría tu paste?</h1>
            </div>
            <div class="col">
                <form class="row g-3">
                    <!-- Campo de nombre-->
                    <div class="col-12">
                        <label for="inputAddress" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="" placeholder="Keso">
                    </div>
                    <!-- Campo de sabor bizacocho -->
                    <div class="col-md-6">
                        <label for="inputState" class="form-label">Sabor del Bizacocho</label>
                        <select id="inputState" class="form-select">
                            <option selected>Seleccionar...</option>
                            <option>Vanilla</option>
                            <option>Chocolate</option>
                            <option>Fresa</option>
                        </select>
                    </div>

                    <!-- Campo de sabor del relleno -->
                    <div class="col-md-6">
                        <label for="inputState" class="form-label">Sabor del Relleno</label>
                        <select id="inputState" class="form-select">
                            <option selected>Seleccionar...</option>
                            <option>Vanilla</option>
                            <option>Chocolate</option>
                            <option>Fresa</option>
                        </select>
                    </div>

                    <!-- Campo de sabor de la cobertura -->
                    <div class="col-6">
                        <label for="inputState" class="form-label">Sabor de la Cobertura</label>
                        <select id="inputState" class="form-select">
                            <option selected>Seleccionar...</option>
                            <option>Vanilla</option>
                            <option>Chocolate</option>
                            <option>Fresa</option>
                        </select>
                    </div>

                    <!-- Campo de número de personas -->
                    <div class="col-md-6">
                        <label for="inputState" class="form-label">Número de Personas</label>
                        <select id="inputState" class="form-select">
                            <option selected>Seleccionar...</option>
                            <option>10</option>
                            <option>15</option>
                            <option>30</option>
                            <option>50</option>
                        </select>
                    </div>

                    <!-- Campo de tipo de entrega -->
                    <div class="col-md-6">
                        <label for="inputState" class="form-label">Entrega</label>
                        <select id="inputState" class="form-select">
                            <option selected>Seleccionar...</option>
                            <option>Entregar en Domicilio</option>
                            <option>Recoger en Tienda</option>
                        </select>
                    </div>

                    <!-- Campo de número de teléfono -->
                    <div class="col-6">
                        <label for="inputAddress" class="form-label">Número de Teléfono</label>
                        <input type="text" class="form-control" id="" placeholder="Keso">
                    </div>

                    <!-- Campo de fecha -->
                    <div class="col-md-6">
                        <div class="mb-6">
                            <label for="fecha" class="form-label">Para que día quieres tu pastel</label>
                            <input type="date" class="form-control" id="fecha" name="fecha" required>
                        </div>
                    </div>

                    <!-- Campo de descripción -->
                    <div class="mb-4">
                        <label for="message" class="form-label">Descripción</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Ingresa tu mensaje"
                            required></textarea>
                    </div>
                    
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Enviar Pedido</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- Llamar navbar y footer-->
    <script src="./js/navbar y footer.js"></script>
    <script>cargarFooter();</script>
    <script>llamarNavbar()</script>
</body>

</html>
