<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="../images/Keso-favicon.png">

    <!-- Importación de Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Outfit:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <title>Login Administradores - Keso</title>

    <style>
        /* ---- Navbar reducida (solo logo + nombre) ---- */
        body {
            padding-top: 16px;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nav-admin-login {
            justify-content: center;
            margin-top: 0;
            width: 100%;
        }

        .nav-admin-title {
            font-family: var(--fuente-titulos);
            font-weight: 700;
            font-size: 1.5rem;
            color: #ffffff;
            margin-left: 14px;
            white-space: nowrap;
        }

        /* ---- Formulario de ingreso ---- */
        .login-admin-main {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 3rem;
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            min-height: 55vh;
            flex: 1;
            width: 100%;
        }

        .login-form-col {
            flex: 1;
            max-width: 420px;
        }

        .login-form-col h1 {
            /*font-family: var(--fuente-texto);*/
            font-family: var(--fuente-titulos);
            font-weight: 700;
            font-size: 2.75rem;
            color: var(--text-color);
            margin-bottom: 2rem;
        }

        .login-form-col label {
            display: block;
            font-family: var(--fuente-texto);
            font-size: .95rem;
            color: #333333;
            margin-bottom: .4rem;
        }

        .login-form-col .campo {
            margin-bottom: 1.5rem;
        }

        .login-form-col input {
            width: 100%;
            padding: .7rem .9rem;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-family: var(--fuente-texto);
            font-size: .95rem;
        }

        .login-form-col input::placeholder {
            color: #b3b3b3;
        }

        .btn-enviar-admin {
            width: 100%;
            padding: .7rem;
            border: none;
            border-radius: 8px;
            background-color: #b6e3f4;
            color: #111111;
            font-family: var(--fuente-texto);
            font-weight: 600;
            cursor: pointer;
            transition: background-color .2s ease;
        }

        .btn-enviar-admin:hover {
            background-color: #9ed7ec;
        }

        .login-divider {
            align-self: stretch;
            width: 1px;
            background-color: var(--accent-color);
        }

        .login-animation-col {
            flex: 1;
             max-width: 420px;
            min-height: 300px;
             display: flex;
            align-items: center;
            justify-content: center;
        }

        .chef-animado {
            max-width: 320px;
            width: 100%;
            height: auto;
            animation: entradaPulso 0.8s ease-out forwards, pulsoContinuo 2s ease-in-out infinite 0.8s;
        }

        @keyframes entradaPulso {
            0% {
                opacity: 0;
                transform: scale(0.6);
            }
            60% {
                opacity: 1;
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes pulsoContinuo {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @media (max-width: 768px) {
            .login-admin-main {
                flex-direction: column;
                align-items: center;
            }

            .login-divider {
                width: 100%;
                height: 1px;
            }

            .login-animation-col {
                min-height: 150px;
            }
        }

        /* ---- Footer reducido (solo adorno + volver al inicio) ---- */
        .footer-login-admin .footer-bottom a {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.4rem;
            text-decoration: none;
        }

        .footer-login-admin .footer-bottom a:hover {
            text-decoration: underline;
        }

        .footer-login-admin .footer-bottom {
            border-top: none;
        }   

        .footer-login-admin {
            position: relative;
        }

        .footer-sticker {
            position: absolute;
            width: 40px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .footer-sticker-1 { left: 5%; }
        .footer-sticker-2 { right: 5%; }

        .footer-sticker-3 {
            top: auto;
            bottom: 8px;
            left: 15%;
            transform: rotate(-15deg);
        }

        .footer-sticker-4 {
            top: auto;
            bottom: 8px;
            right: 15%;
            transform: rotate(12deg);
        }

        .footer-sticker-5 {
            top: auto;
            bottom: 38px;
            left: 25%;
            transform: rotate(8deg);
        }

        .footer-sticker-6 {
            top: auto;
            bottom: 38px;
            right: 25%;
            transform: rotate(-10deg);
        }

    </style>
</head>

<div class="page-wrapper">
    <body>

        <nav class="nav-admin-login">
            <a href="/index.html" class="logo">
                <img src="/images/logo-removebg-preview.png" alt="Keso">
            </a>
            <span class="nav-admin-title">Keso Pasteleria</span>
        </nav>

        <main class="login-admin-main">

            <div class="login-form-col">
                <h1>Ingresar</h1>

                <form id="form-login-admin">
                    <div class="campo">
                        <label for="admin-usuario">Usuario</label>
                        <input type="text" id="admin-usuario" name="usuario" placeholder="Escriba aquí" required>
                    </div>

                    <div class="campo">
                        <label for="admin-contrasena">Contraseña</label>
                        <input type="password" id="admin-contrasena" name="contrasena" placeholder="Escriba aquí" required>
                    </div>

                    <button type="submit" class="btn-enviar-admin">Enviar</button>
                </form>
            </div>

            <div class="login-divider"></div>

            <div class="login-animation-col">
                <img src="/svg/chef1.svg" alt="Chef Keso" class="chef-animado">
            </div>

        </main>

        <footer class="site-footer footer-login-admin">
            <img id="adornoFooter" src="/images/imgFooter/adorno-footer.png" alt="">
            <img src="../svg/cupcake-svgrepo-com.svg" class="footer-sticker footer-sticker-1">
            <img src="../svg/strawberry-cake-svgrepo-com.svg" class="footer-sticker footer-sticker-2">
            <img src="../svg/glove-svgrepo-com.svg" class="footer-sticker footer-sticker-3">
            <img src="../svg/meringue-svgrepo-com.svg" class="footer-sticker footer-sticker-4">
            <img src="../svg/flour-svgrepo-com.svg" class="footer-sticker footer-sticker-5">
            <img src="../svg/pastry-bag-svgrepo-com.svg" class="footer-sticker footer-sticker-6">
            <p class="footer-bottom"><a href="/index.html">Volver al inicio</a></p>
        </footer>

    </body>
</div>

</html>
