<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@600;700&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet" type="text/css"/>
    <link href="styleP.css" rel="stylesheet" type="text/css"/>
    <title>Panel Administrativo Keso</title>
</head>
<body>
    
    <div class="app-container">
        
        <aside class="sidebar">
            <img src="/images/logo.jpeg" width="30px">
            <h2>Panel</h2>
            <nav class="sidebar-nav">
                <a href="#" class="active">Agregar Producto</a>
                <a href="#">Pedidos</a>
                <a href="#">Productos</a>
                <a href="#">Clientes</a>
                <a href="#">Nuevo Producto</a>
            </nav>
        </aside>

        
        <main class="main-content">
            <div class="container">
                <h1>Agregar nuevo Producto</h1>
                
                
                <div class="form-section">
                    <div class="row">
                        <div class="col">
                            <label for="NombreProducto" class="form-label">Nombre del producto</label>
                            <input type="text" class="form-control" id="NombreProducto" name="NombreProducto" placeholder=" ">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="Descripcion" class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="Descripcion" name="Descripcion" placeholder="Describe el producto">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="Relleno" class="form-label">Relleno</label>
                            <select name="Relleno" id="Relleno" class="form-select" required>
                                <option value="Agregar relleno">Agregar nuevo relleno</option>
                                <option value="Crema con oreo">Crema con oreo</option>
                                <option value="Chocolate">Chocolate</option>
                                <option value="Creama batida">Creama batida</option>
                                <option value="Fruta (fresa, durazno)">Fruta (fresa, durazno)</option>
                                <option value="Nuez">Nuez</option>
                                <option value="Cajeta">Cajeta</option>
                                <option value="Mermelada">Mermelada</option>
                                <option value="Queso con mermelada">Queso con mermelada</option>
                                <option value="Flan">Flan</option>
                                <option value="Trufa">Trufa</option>
                                <option value="Ganache de chocolate (blanco u oscuro)">Ganache de chocolate (blanco u oscuro)</option>
                                <option value="Cream pastelera">Cream pastelera</option>
                                <option value="Crema con queso">Crema con queso</option>
                                <option value="Crema de avellana">Crema de avellana</option>
                                <option value="Cheesecake">Cheesecake</option>
                            </select>
                        </div>

                        <div class="col">
                            <label for="Cobertura" class="form-label">Cobertura</label>
                            <select name="Cobertura" id="Cobertura" class="form-select" required>
                                <option value="Agregar cobertura">Agregar nueva cobertura</option>
                                <option value="Chantilly">Chantilly</option>
                                <option value="Crema batida">Crema batida</option>
                                <option value="Ganache de chocolate">Ganache de chocolate</option>
                                <option value="Crema de mantequilla">Crema de mantequilla</option>
                                <option value="Fondat">Fondat</option>
                            </select>
                        </div>

                        <div class="col">
                            <label for="Pan" class="form-label">Pan</label>
                            <select name="Pan" id="Pan" class="form-select" required>
                                <option value="Agregar Pan">Agregar nuevo pan</option>
                                <option value="3 leches">3 leches (vainilla, moka, chocolate, rompope, marmolado)</option>
                                <option value="Limon">Limón</option>
                                <option value="Naranja">Naranja</option>
                                <option value="Marmoleado">Marmoleado (naranja y chocolate)</option>
                                <option value="Chocolate">Chocolate</option>
                                <option value="Rompope">Rompope</option>
                                <option value="Vainilla">Vainilla</option>
                                <option value="Zanahoria con nuez">Zanahoria con nuez</option>
                                <option value="Queso crema y naranja">Queso crema y naranja</option>
                                <option value="Fresa">Fresa</option>
                                <option value="Coco">Coco</option>
                                <option value="Moka">Moka</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="Precio" class="form-label">Precio</label>
                            <input type="text" class="form-control" id="Precio" name="Precio" placeholder="$">
                        </div>
                        <div class="col">
                            <label for="Numeropersonas" class="form-label">Numero de personas</label>
                            <select name="Numeropersonas" id="Numeropersonas" class="form-select" required>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                                <option value="13">13</option>
                                <option value="14">14</option>
                                <option value="15">15</option>
                            </select>
                        </div>
                    </div>
                </div>

                
                <div class="AgregarIMG">
                    <p>Imagen del Producto</p>
                    <input type="file" class="form-control">
                </div>

            </div>
        </main>

    </div>
</body>
</html>

<script src="/js/navbar y footer.js"></script>
<script>cargarFooter();</script>
<script>llamarNavbar()</script>
</body>
